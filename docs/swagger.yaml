info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 基于 Gin 和 RBAC 的权限管理系统 API 文档。
  termsOfService: http://swagger.io/terms/
  title: RBAC 系统 API 文档
  version: "1.0"
paths:
  /api/v1/admin-auth/companies:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 删除ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CompanyDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 批量删除公司
      tags:
      - 公司管理
    get:
      parameters:
      - description: 综合查询条件
        in: query
        name: q
        type: string
      - description: 公司名称
        in: query
        name: name
        type: string
      - description: 公司编码
        in: query
        name: code
        type: string
      - description: 状态(0:禁用,1:启用)
        in: query
        name: status
        type: integer
      - description: 负责人ID
        in: query
        name: managerId
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/dto.PaginationResponse'
                  - properties:
                      records:
                        items:
                          $ref: '#/definitions/dto.CompanyResponse'
                        type: array
                    type: object
              type: object
      summary: 获取公司列表
      tags:
      - 公司管理
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CompanyCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyResponse'
              type: object
      summary: 创建公司
      tags:
      - 公司管理
  /api/v1/admin-auth/companies/{id}:
    delete:
      parameters:
      - description: 公司ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 删除公司
      tags:
      - 公司管理
    get:
      parameters:
      - description: 公司ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyResponse'
              type: object
      summary: 获取公司详情
      tags:
      - 公司管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 公司ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CompanyUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 更新公司
      tags:
      - 公司管理
  /api/v1/admin-auth/companies/{id}/users:
