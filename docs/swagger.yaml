        in: path
        name: id
        required: true
        type: integer
      - description: 综合查询条件（模糊匹配用户名、手机号、邮箱）
        in: query
        name: q
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
