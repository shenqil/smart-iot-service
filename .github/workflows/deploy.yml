name: Deploy to Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        
    - name: Build
      run: |
        go env -w GOPROXY=https://goproxy.cn,direct
        GOOS=linux CGO_ENABLED=1 GOARCH=amd64 go build -o gin-admin
        
    - name: Login to Aliyun Container Registry
      uses: aliyun/acr-login@v1
      with:
        region-id: "cn-hangzhou"
        access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        
    - name: Build and push Docker image
      run: |
        docker build -t crpi-14aq4ypr9y9smv5q.cn-hangzhou.personal.cr.aliyuncs.com/fssq/smart-iot-admin:latest .
        docker push crpi-14aq4ypr9y9smv5q.cn-hangzhou.personal.cr.aliyuncs.com/fssq/smart-iot-admin:latest
        
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /root/gin-admin
          docker-compose pull
          docker-compose up -d